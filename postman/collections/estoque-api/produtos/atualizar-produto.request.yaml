$kind: http-request
name: Atualizar Produto
method: PUT
url: '{{baseUrl}}/produtos/:id'
order: 2000
pathVariables:
  - key: id
    value: '1'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nome": "Produto Atualizado",
      "preco": 200.00,
      "quantidade": 5
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Resposta contém confirmação de alteração", function () {
          pm.expect(pm.response.text()).to.include("foi alterado");
      });
